<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
            max-width: 680px;
            width: 100%;
            padding: 40px;
        }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 28px; color: #1a1a2e; margin-bottom: 8px; }
        .header p { color: #666; font-size: 14px; }
        .badge {
            display: inline-block;
            background: #0f3460;
            color: white;
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 20px;
            margin-top: 6px;
        }
        .examples { margin-bottom: 18px; }
        .examples p { font-size: 13px; color: #666; margin-bottom: 8px; }
        .ex-btns { display: flex; gap: 8px; flex-wrap: wrap; }
        .ex-btn {
            padding: 5px 12px;
            border: 1px solid #ccc;
            border-radius: 20px;
            background: #f5f5f5;
            font-size: 12px;
            cursor: pointer;
            color: #555;
            transition: all 0.2s;
        }
        .ex-btn:hover { background: #0f3460; color: white; border-color: #0f3460; }
        .input-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; color: #333; margin-bottom: 8px; font-size: 14px; }
        textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            resize: vertical;
            min-height: 120px;
            outline: none;
            transition: border-color 0.3s;
        }
        textarea:focus { border-color: #0f3460; }
        .char-count { text-align: right; font-size: 12px; color: #999; margin-top: 4px; }
        .btn-analyze {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0f3460, #533483);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-analyze:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(15,52,96,0.4); }
        .btn-analyze:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .loading { display: none; text-align: center; padding: 20px; }
        .loading.show { display: block; }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #f0f0f0;
            border-top: 4px solid #0f3460;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .result { display: none; margin-top: 24px; }
        .result.show { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
        .result-card { border-radius: 12px; padding: 26px; text-align: center; }
        .result-card.positive { background: linear-gradient(135deg, #55efc4, #00b894); color: white; }
        .result-card.negative { background: linear-gradient(135deg, #ff7675, #d63031); color: white; }
        .result-icon { font-size: 52px; margin-bottom: 10px; }
        .result-label { font-size: 30px; font-weight: 700; margin-bottom: 6px; }
        .result-confidence { font-size: 15px; opacity: 0.9; margin-bottom: 16px; }
        .bar-wrap { background: rgba(255,255,255,0.3); border-radius: 20px; height: 10px; overflow: hidden; }
        .bar { height: 100%; background: white; border-radius: 20px; transition: width 0.8s ease; }
        .result-review {
            margin-top: 16px;
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            text-align: left;
            font-style: italic;
        }
        .error-box {
            background: #fee;
            border-left: 4px solid #c33;
            color: #933;
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 16px;
            display: none;
        }
        .error-box.show { display: block; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Sentiment Analysis</h1>
        <p>RNN model trained on IMDB — classifies text as Positive or Negative</p>
        <span class="badge">EXP 6 — RNN / IMDB</span>
    </div>

    <div class="examples">
        <p>Try an example:</p>
        <div class="ex-btns">
            <button class="ex-btn" onclick="setEx(0)">Positive review</button>
            <button class="ex-btn" onclick="setEx(1)">Negative review</button>
            <button class="ex-btn" onclick="setEx(2)">Mixed review</button>
        </div>
    </div>

    <div class="input-group">
        <label for="reviewInput">Enter a movie review or any text</label>
        <textarea id="reviewInput" placeholder="Type your review here..." oninput="updateCount()"></textarea>
        <div class="char-count"><span id="charCount">0</span> characters</div>
    </div>

    <button class="btn-analyze" id="analyzeBtn" onclick="analyze()">Analyze Sentiment</button>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p style="color:#666;font-size:14px;">Running RNN inference...</p>
    </div>

    <div class="error-box" id="errorBox"></div>

    <div class="result" id="result">
        <div class="result-card" id="resultCard">
            <div class="result-icon" id="resultIcon"></div>
            <div class="result-label" id="resultLabel"></div>
            <div class="result-confidence" id="resultConfidence"></div>
            <div class="bar-wrap"><div class="bar" id="bar" style="width:0%"></div></div>
            <div class="result-review" id="resultReview"></div>
        </div>
    </div>
</div>

<script>
    const examples = [
        "This movie was absolutely fantastic! The acting was superb, the story was gripping, and I was on the edge of my seat the entire time. Highly recommend!",
        "What a waste of time. The plot made no sense, the acting was terrible, and the special effects looked cheap. I walked out halfway through.",
        "It had some good moments and the visuals were impressive, but the story felt rushed and the characters were underdeveloped. Average at best."
    ];

    function setEx(i) {
        document.getElementById('reviewInput').value = examples[i];
        updateCount();
        document.getElementById('result').classList.remove('show');
        document.getElementById('errorBox').classList.remove('show');
    }

    function updateCount() {
        document.getElementById('charCount').textContent = document.getElementById('reviewInput').value.length;
    }

    async function analyze() {
        const review = document.getElementById('reviewInput').value.trim();
        if (!review) { showError('Please enter some text.'); return; }

        document.getElementById('result').classList.remove('show');
        document.getElementById('errorBox').classList.remove('show');
        document.getElementById('loading').classList.add('show');
        document.getElementById('analyzeBtn').disabled = true;

        try {
            const res  = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ review })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Prediction failed');
            showResult(data);
        } catch(e) {
            showError(e.message);
        } finally {
            document.getElementById('loading').classList.remove('show');
            document.getElementById('analyzeBtn').disabled = false;
        }
    }

    function showResult(data) {
        const isPos = data.sentiment === 'POSITIVE';
        document.getElementById('resultCard').className = 'result-card ' + (isPos ? 'positive' : 'negative');
        document.getElementById('resultIcon').textContent  = isPos ? '😊' : '😞';
        document.getElementById('resultLabel').textContent = data.sentiment;
        document.getElementById('resultConfidence').textContent = 'Confidence: ' + data.confidence + '%';
        document.getElementById('resultReview').textContent = '"' + data.review + '"';
        setTimeout(() => { document.getElementById('bar').style.width = data.confidence + '%'; }, 100);
        document.getElementById('result').classList.add('show');
    }

    function showError(msg) {
        const eb = document.getElementById('errorBox');
        eb.textContent = 'Error: ' + msg;
        eb.classList.add('show');
    }
</script>
</body>
</html>
