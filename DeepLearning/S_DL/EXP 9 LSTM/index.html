<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Word Predictor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📚 Next Word Predictor</h1>
        <p class="subtitle">Powered by H5 Model trained on Novel</p>
        
        <div class="input-section">
            <label for="inputText">Enter your text:</label>
            <textarea id="inputText" placeholder="Type your text here..." rows="4"></textarea>
            
            <div class="controls">
                <div class="slider-container">
                    <label for="wordCount">Number of words to predict: <span id="wordCountValue">5</span></label>
                    <input type="range" id="wordCount" min="1" max="15" value="5">
                </div>
                
                <button id="predictBtn" class="predict-btn">Predict Next Words</button>
            </div>
        </div>
        
        <div class="output-section">
            <h3>Predicted Text:</h3>
            <div id="output" class="output-box">
                <p class="placeholder">Your predictions will appear here...</p>
            </div>
        </div>
        
        <div class="model-info">
            <p><strong>Model Status:</strong> <span id="modelStatus">Checking...</span></p>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
